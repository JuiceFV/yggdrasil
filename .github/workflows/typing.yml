name: Type Checking

on: [push, pull_request]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jakebailey/pyright-action@v1
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - run: |
          pip install mypy
      - run: |
          mypy src/