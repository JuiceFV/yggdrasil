name: 🐛 Bug Report
description: Create a report to help us reproduce and fix the bug

title: '[Bug] '
labels: bug, needs triage
body:
- type: checkboxes
  attributes:
    label: Checklist
    description: Before creating the issue make sure you are completed the following steps
    options:
      - label: I have searched for existing issues
        required: true
      - label: I have reproduced the issue with the latest version
        required: true
- type: textarea
  id: description
  attributes:
    label: Describe the bug
    description: A clear and concise description of what the bug is.
    placeholder: Tell us about the bug...
- type: textarea
  attributes:
    label: Versions
    description: |
      Please run the following and paste the output below.
      ```sh
      wget https://raw.githubusercontent.com/pytorch/pytorch/main/torch/utils/collect_env.py
      # For security purposes, please check the contents of collect_env.py before running it.
      python collect_env.py
      ```
  validations:
    required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
      placeholder: Any other context...
