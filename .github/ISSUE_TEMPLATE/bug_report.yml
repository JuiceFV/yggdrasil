name: 🐛 Bug Report
description: Create a report to help us reproduce and fix the bug

title: '[Bug] '
labels: bug, needs triage
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug.

        **Checklist**
        - [ ] I have searched for existing issues
        - [ ] I have reproduced the issue with the latest version

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: Tell us about the bug...

  - type: textarea
    id: reproduction
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: Describe the steps to reproduce...

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Details about your environment, including versions and hardware.
      placeholder: e.g., Python 3.9, PyTorch 1.10, CUDA 11.3

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
      placeholder: Any other context...
