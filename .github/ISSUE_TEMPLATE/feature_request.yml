name: Feature request
description: Suggest an idea for this project.
title: '[Feature Request] '
labels: enhancement, needs triage
body:
  - type: checkboxes
    attributes:
      label: Checklist
      description: Before creating the issue make sure you are completed the following steps
      options:
        - label: I have searched for existing issues
          required: true
        - label: I have discussed this feature with the repository contributors
          required: true

  - type: textarea
    id: feature
    attributes:
      label: 🚀 The feature, motivation and pitch
      description: A clear and concise description of the feature proposal.
        Please outline the motivation for the proposal. Is your feature request
        related to a specific problem? e.g., "I'm working on X and would like Y to be possible".
        If this is related to another GitHub issue, please link here too.
      placeholder: Describe the feature...
      validations:
        required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: A description of any alternative solutions or features you've considered, if any.
      placeholder: Alternatives you've considered...
      validations:
        required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add any other context or screenshots about the feature request.
      placeholder: Any other context...
      validations:
        required: false
