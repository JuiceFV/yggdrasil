name: Feature request
description: Suggest an idea for this project.
title: '[Feature Request] '
labels: enhancement, needs triage
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature.

        **Checklist**
        - [ ] I have searched for existing issues
        - [ ] I have discussed this feature with the community

  - type: textarea
    id: feature
    attributes:
      label: Feature description
      description: A clear and concise description of the feature proposal.
      placeholder: Describe the feature...

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Explain why this feature should be added.
      placeholder: Why do you want this feature?

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Describe any alternative solutions you've considered.
      placeholder: Alternatives you've considered...

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add any other context or screenshots.
      placeholder: Any other context...
