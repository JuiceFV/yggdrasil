[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "project"
requires-python = "==3.11.*" # python version is fixed to the DBX ML 15.4 runtime python version for compatibility
dynamic = ["version"]
dependencies = [
    "python-dotenv",
    "numpy",
    "rich",
    "torch==2.3.1", # according to DBX runtime 
    "lightning==2.4.0",
    "torchmetrics>=1.1.1",
    "hydra-core==1.3.1",
    "hydra-colorlog==1.2.0",
    "hydra-ray-launcher>=1.2.1",
    "hydra-zen",
    "mlflow>=2.9.2",
    # system monitoring for cpu and gpu for mlflow
    "psutil",
    "pynvml",
]

[project.optional-dependencies]
spark = ["pyspark==3.5.0"] # according to DBX runtime 
dev = [
    "numpy",
    "pandas",
    "ipykernel",
    "ipywidgets",
    "matplotlib",
    "plotly",
    "ruff==0.6.4",
    "mypy==1.11.2",
    "pyright==1.1.379",
    "pre-commit==3.8.0",
    "pytest",
    "pytest-cov",
    "pytest-xdist",
]
dbx = ["dbx>=0.8.14"] # databricks cli
connect = ["databricks-connect>=13.0.1"] # remote connection to databricks spark clusters (messes up pyspark install)

# [tool.setuptools.packages.find]
# include = ["floor_optimization"]
# namespaces = false

# [tool.setuptools-git-versioning]
# enabled = true

[tool.ruff]
include = ["*.py", "*.pyi", "**/pyproject.toml"]
exclude = ["notebooks"]
line-length = 88

[tool.ruff.lint]
select = [
    # Pyflakes
    "F",
    # Pycodestyle
    "E",
    "W",
    # isort
    "I001",
]
# ignore = ["E712"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
norecursedirs = "tests/helpers"
